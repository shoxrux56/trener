<script>
"use strict";
/* ============ sozlamalar ============ */
var IV=[0,1,3,7,16,35,70,140];          // takrorlash oraliqlari (kun)

var tg=window.Telegram&&Telegram.WebApp,inTG=!!(tg&&tg.platform&&tg.platform!=="unknown");
try{if(tg){tg.ready();tg.expand();if(tg.colorScheme)document.documentElement.setAttribute("data-theme",tg.colorScheme)}}catch(e){}
var DAYS=window.DAYS||[];
var $=function(s){return document.querySelector(s)};
function sh(a){return a.slice().sort(function(){return Math.random()-.5})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

/* ============ rus -> lotin (taxminiy o'qilishi) ============ */
var TR={а:"a",б:"b",в:"v",г:"g",д:"d",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"kh",ц:"ts",ч:"ch",ш:"sh",щ:"shch",ъ:"",ь:"",ы:"i",э:"e",ю:"yu",я:"ya",ё:"yo"};
function trl(s){var o="",prev=" ";for(var i=0;i<s.length;i++){var ch=s[i],lo=ch.toLowerCase(),t;
  if(lo==="е"){t=(" aeiouаеёиоуыэюя'ьъ".indexOf(prev.toLowerCase())>=0||/[^а-яёa-z]/i.test(prev))?"ye":"e"}
  else if(TR[lo]!==undefined)t=TR[lo];else t=ch;
  if(ch!==lo&&t)t=t[0].toUpperCase()+t.slice(1);o+=t;prev=ch}return o}

/* ============ tovush ============ */
function snd(f,d){d=d||.15;try{var c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type="triangle";g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
var VOICE=null;

function sayT(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="ru-RU";if(VOICE)u.voice=VOICE;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}

/* ============ saqlash: Telegram CloudStorage + localStorage ============ */
var Store={
  cloud:function(){try{return inTG&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.9")?tg.CloudStorage:null}catch(e){return null}},
  loadLocal:function(){try{return JSON.parse(localStorage.getItem("rm_srs2")||"{}")}catch(e){return {}}},
  saveLocal:function(m){try{localStorage.setItem("rm_srs2",JSON.stringify(m))}catch(e){}},
  all:function(){var self=this;return new Promise(function(res){
    var loc=self.loadLocal(),c=self.cloud();if(!c)return res(loc);

    function fin(v){if(!done){done=true;clearTimeout(t);res(v)}}
    try{c.getKeys(function(e,keys){if(e||!keys||!keys.length)return fin(loc);
      keys=keys.filter(function(k){return /^s\d+$/.test(k)||k==="g"});
      c.getItems(keys,function(e2,o){var m=Object.assign({},loc);
        if(!e2&&o)for(var k in o){try{var r=JSON.parse(o[k]);if(!m[k]||(r.t||0)>(m[k].t||0))m[k]=r}catch(x){}}
        self.saveLocal(m);fin(m)})})}catch(x){fin(loc)}})},
  put:function(key,rec){rec.t=Date.now();var m=this.loadLocal();m[key]=rec;this.saveLocal(m);
    var c=this.cloud();if(c){try{c.setItem(key,JSON.stringify(rec),function(){})}catch(e){}}return m}
};

/* ============ holat ============ */
var S={},G={xp:0,sk:0,last:0};
var its=[],UN=[],dayRec={v:[],p:0};
var L=null,R=null,POOL=[];
DAYS.forEach(function(d){d.i.forEach(function(x){POOL.push(x)})});
function saveDay(){Store.put("s"+DAY,{v:dayRec.v,p:dayRec.p});S["s"+DAY]={v:dayRec.v,p:dayRec.p}}
function saveG(){Store.put("g",{xp:G.xp,sk:G.sk,last:G.last})}
function bumpStreak(){var t=today();if(G.last===t)return;G.sk=(G.last===t-1)?G.sk+1:1;G.last=t}
function dueAll(){var t=today(),out=[];
  Object.keys(S).forEach(function(k){if(!/^s\d+$/.test(k))return;var d=+k.slice(1),day=DAYS[d-1];if(!day)return;var v=S[k].v||[];
    for(var i=0;i<day.i.length;i++){var r=v[i];if(r&&r[1]<=t)out.push({day:d,idx:i,over:t-r[1],it:day.i[i]})}});
  out.sort(function(a,b){return b.over-a.over});return out}
function learnedAll(){var out=[];Object.keys(S).forEach(function(k){if(!/^s\d+$/.test(k))return;var d=+k.slice(1),day=DAYS[d-1];if(!day)return;var v=S[k].v||[];
  for(var i=0;i<day.i.length;i++)if(v[i])out.push({day:d,idx:i,it:day.i[i]})});return out}

/* ============ bosh sahifa (yo'l xaritasi) ============ */
function home(){L=null;
  var day=DAYS[DAY-1];
  var nodes=UN.map(function(u,i){var st=i<dayRec.p?"done":i===dayRec.p?"cur":"lock";return node(i,st,u.e,u.n)});
  var mst=dayRec.p>UN.length?"done":dayRec.p===UN.length?"cur":"lock";nodes.push(node(UN.length,mst,"🏆","Yakuniy test"));
  $("#app").innerHTML='<div class="hd"><span class="y">🔥 '+G.sk+'</span><span class="p">⭐ '+G.xp+' XP</span><span class="h">❤️ 5</span></div>'+
    '<div class="unit"><small>'+day.lv+' · KUN '+DAY+'</small><h2>'+day.e+' '+esc(day.t)+' ('+day.p+'/'+day.k+')</h2><div class="sit">📍 '+esc(day.s)+'</div></div>'+
    '<div class="path">'+nodes.join("")+'</div>'+
    (dayRec.p>UN.length?'<div class="bd"><div class="note" style="text-align:center">🎉 Bugungi dars tayyor! Botga qaytib, shu kunning testini bosing.</div></div>':'')}
function node(i,st,e,name){var off=[0,50,-45,40,0,-30][i%6];
  return '<div style="transform:translateX('+off+'px);text-align:center"><button class="nd '+st+'" '+(st==="lock"?"":'onclick="start('+i+')"')+'>'+(st==="cur"?'<span class="s">BOSHLASH</span>':'')+(st==="done"?"⭐":e)+'</button><div class="lb">'+esc(name)+'</div></div>'}

/* ============ mashq turlari (har xil shablonlar) ============ */
function spk(){try{var q=L&&L.q[L.i];if(q&&q.item)getPk(Math.floor((q.item[0]-13)/100)).catch(function(){})}catch(e){}return '<button class="spk" onclick="sayCur()" aria-label="Eshitish">🔊</button>'}
var AU=null,PK={};
function getPk(b){if(!PK[b])PK[b]=fetch("ovoz/p"+b+".bin").then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(buf){var dv=new DataView(buf),c=dv.getUint32(0,true),m={},base=4+c*12;for(var i=0;i<c;i++){var o=4+i*12;m[dv.getUint32(o,true)]=[base+dv.getUint32(o+4,true),dv.getUint32(o+8,true)]}return{buf:buf,m:m,u:{}}}).catch(function(e){delete PK[b];throw e});return PK[b]}
function sayCur(){var it=L&&L.q[L.i];if(!it||!it.item)return;try{speechSynthesis.cancel()}catch(e){}
try{if(AU)AU.pause()}catch(e){}
var n=it.item[0],blk=Math.floor((n-13)/100),urls=["audio/"+blk+"/"+n+".mp3","audio/"+n+".mp3"],k=0,done=false;
var fb=function(){if(done)return;if(k<urls.length)return go();done=true;sayT(it.item[1])};
var go=function(){var a=new Audio(urls[k++]);AU=a;a.onerror=function(){if(AU===a)fb()};try{var p=a.play();if(p&&p.catch)p.catch(function(){if(AU===a)fb()})}catch(e){fb()}};
getPk(blk).then(function(p){var e=p.m[n];if(!e)throw 0;if(!p.u[n])p.u[n]=URL.createObjectURL(new Blob([p.buf.slice(e[0],e[0]+e[1])],{type:"audio/mpeg"}));var a=new Audio(p.u[n]);AU=a;a.onerror=function(){if(AU===a)fb()};var pr=a.play();if(pr&&pr.catch)pr.catch(function(){if(AU===a)fb()})}).catch(function(){fb()})}
function distract(item,field,n){var Ln=item[field].length;
  var c=POOL.filter(function(x){return x[0]!==item[0]&&x[field]!==item[field]&&Math.abs(x[field].length-Ln)<=Math.max(8,Ln*.5)});
  if(c.length<n)c=POOL.filter(function(x){return x[0]!==item[0]});return sh(c).slice(0,n).map(function(x){return x[field]})}
function core(w){var m=w.match(/^([«"(]*)(.+?)([.,!?;:»")…]*)$/);return m?[m[1],m[2],m[3]]:["",w,""]}
function mkEx(t,it,k){var e={t:t,item:it,k:k};
  if(t==="fill"){var w=words(it[1]);if(w.length<3)t=e.t="mc";
    else{var bi=0,bl=0;w.forEach(function(x,i){var c=core(x)[1];if(c.length>bl){bl=c.length;bi=i}});var p=core(w[bi]),ans=p[1];
      var dis=[];sh(POOL).some(function(x){words(x[1]).forEach(function(z){var c=core(z)[1];if(dis.length<2&&c.length>=3&&Math.abs(c.length-ans.length)<=3&&c.toLowerCase()!==ans.toLowerCase()&&dis.indexOf(c)<0&&w.map(function(q){return core(q)[1].toLowerCase()}).indexOf(c.toLowerCase())<0)dis.push(c)});return dis.length>=2});
      var shown=w.map(function(x,i){return i===bi?p[0]+"＿＿＿＿"+p[2]:x}).join(" ");
      e.title="Bo‘sh joyni to‘ldiring";e.head='<div class="bub" style="margin-bottom:10px">'+esc(it[2])+'</div><div class="ru" style="font-size:25px;margin-bottom:16px">'+esc(shown)+'</div>';e.o=sh([ans].concat(dis));e.a=ans;return e}}
  if(t==="mc"){e.title="Bu o‘zbekchada nima?";e.head='<div class="mini">'+esc(it[3])+'</div><div class="ru" style="margin-bottom:16px">'+esc(it[1])+spk()+'</div>';e.o=sh([it[2]].concat(distract(it,2,3)));e.a=it[2]}
  else if(t==="uzru"){e.title="Ruscha qanday aytiladi?";e.head='<div class="bub" style="margin-bottom:16px;font-size:20px"><span class="mini" style="display:inline;margin-right:6px">'+esc(it[3])+'</span>'+esc(it[2])+'</div>';e.o=sh([it[1]].concat(distract(it,1,3)));e.a=it[1]}
  else if(t==="tf"){var good=Math.random()<.5,shown2=good?it[2]:distract(it,2,1)[0];
    e.title="Bu tarjima to‘g‘rimi?";e.head='<div class="ru" style="margin-bottom:14px">'+esc(it[1])+spk()+'</div><div class="tfbox"><small>Berilgan tarjima</small>“'+esc(shown2)+'”</div><div class="note" style="margin:0 0 12px">Quyidagidan birini tanlang:</div>';
    e.o=["Ha, to‘g‘ri ✅","Yo‘q, noto‘g‘ri ❌"];e.a=good?e.o[0]:e.o[1]}
  else if(t==="build"){var w2=words(it[1]);if(w2.length<3)return mkEx("uzru",it,k);
    var ex=[];sh(POOL).some(function(x){words(x[1]).forEach(function(z){if(ex.length<2&&w2.indexOf(z)<0&&ex.indexOf(z)<0&&z.length>1)ex.push(z)});return ex.length>=2});
    e.pool=sh(w2.concat(ex).map(function(x,i){return {w:x,i:i}}))}
  return e}
function mkMatch(ks){var cells=[];ks.forEach(function(k){cells.push({id:its[k][0],side:0,t:its[k][1]},{id:its[k][0],side:1,t:its[k][2]})});
  return {t:"match",item:null,k:-1,cells:sh(cells),gone:{},sel:null,left:ks.length,err:0}}
function fixAdj(a){for(var i=1;i<a.length;i++){if(a[i].t===a[i-1].t){for(var j=i+1;j<a.length;j++){if(a[j].t!==a[i-1].t&&(!a[i+1]||a[j].t!==a[i+1].t||j===i+1)){var x=a[i];a[i]=a[j];a[j]=x;break}}}}return a}
function exOld(w){var ty=["mc","fill","build","uzru"][Math.floor(Math.random()*4)],e=mkEx(ty,w.it,-1);e.old=w;return e}
function mk(u){var q=[];
  if(u<UN.length){var ks=UN[u].k,quick=["mc","tf"],second=["fill","build","uzru"];
    ks.forEach(function(k,j){q.push({t:"teach",k:k,item:its[k]});q.push(mkEx(quick[(j+u)%2],its[k],k))});
    var arr=ks.map(function(k,j){return mkEx(second[(j+u)%3],its[k],k)});arr=fixAdj(sh(arr));
    if(OLD[u])arr.splice(Math.floor(Math.random()*(arr.length+1)),0,exOld(OLD[u]));
    q=q.concat(fixAdj(arr));if(ks.length>=3)q.push(mkMatch(ks))}
  else{var T5=["mc","tf","fill","build","uzru"],off=Math.floor(Math.random()*5);
    var arr2=fixAdj(sh(its.map(function(_,k){return mkEx(T5[(k+off)%5],its[k],k)})));
    var idx=its.map(function(_,i){return i}),h=Math.ceil(idx.length/2);
    q=arr2;if(idx.length>=4){q.splice(Math.ceil(q.length/2),0,mkMatch(sh(idx).slice(0,Math.min(5,h))));q.push(mkMatch(sh(idx).slice(0,Math.min(5,h))))}}
  return q}
function start(u){var q=mk(u);L={u:u,q:q,i:0,d:0,tot:q.length,hp:5,st:"ask",sel:null,pick:[],xp:0,err:0};draw()}

function draw(){var it=L.q[L.i];if(!it)return L.test?finTest():fin();var s=it.item,b="",ft="";
  if(it.t==="teach"){var nT=L.q.filter(function(x){return x.t==="teach"}).length,nth=L.q.slice(0,L.i+1).filter(function(x){return x.t==="teach"}).length;
    b='<div class="owl"><div class="o">🦊</div><div class="bub">Yangi gap '+nth+'/'+nT+'</div></div>'+
      '<div class="scene" data-n="'+s[0]+'"><span class="em">'+esc(s[3])+'</span></div>'+
      '<div class="ru">'+esc(s[1])+spk()+'</div><div class="tr">🗣 '+esc(trl(s[1]))+'</div><div class="uz">'+esc(s[2])+'</div>'+
      '<div class="when">📍 <b>Qayerda va qachon aytiladi:</b><br>'+esc(s[4]||DAYS[DAY-1].s)+'</div>';
    ft='<div class="ft"><button class="btn" onclick="nxt(1)">Tushunarli</button></div>'}
  else if(it.t==="match"){
    b='<div class="q">Juftliklarni toping</div><div class="mt">'+it.cells.map(function(c,j){var cls=it.gone[j]?"gone":it.bad&&it.bad.indexOf(j)>=0?"no":it.sel===j?"sel":"";
      return '<button class="op mtc '+cls+'" '+(it.gone[j]||L.st!=="ask"?"disabled":'onclick="mt('+j+')"')+'>'+esc(c.t)+'</button>'}).join("")+'</div>';
    ft=L.st==="ask"?'<div class="ft"><button class="btn" disabled>Juftliklarni tanlang</button></div>':'<div class="ft ok"><div class="fm">'+(it.err?"Juftliklar topildi (xatolar bilan)":"✅ Hammasi to‘g‘ri!")+'</div><button class="btn" onclick="nxt(1)">Davom etish</button></div>'}
  else{
    if(it.t==="build"){
      b='<div class="q">Ruscha tuzing</div><div class="bub" style="margin-bottom:6px;font-size:20px"><span class="mini" style="display:inline;margin-right:6px">'+esc(s[3])+'</span>'+esc(s[2])+'</div><div class="ans">'+L.pick.map(function(p,j){return '<button class="tl" onclick="ub('+j+')">'+esc(p.w)+'</button>'}).join("")+'</div><div class="bank">'+it.pool.map(function(p,j){return '<button class="tl" onclick="ab('+j+')">'+esc(p.w)+'</button>'}).join("")+'</div>'}
    else{
      b='<div class="q">'+it.title+'</div>'+it.head+it.o.map(function(o,j){var cls=L.st==="ask"?(L.sel===j?"sel":""):(o===it.a?"ok":(L.sel===j?"no":""));
        return '<button class="op '+cls+'" '+(L.st==="ask"?'onclick="L.sel='+j+';draw()"':'')+'>'+esc(o)+'</button>'}).join("")}
    var ready=it.t==="build"?L.pick.length>0:L.sel!=null;
    if(L.st==="ask")ft='<div class="ft"><button class="btn" '+(ready?"":"disabled")+' onclick="chk()">Tekshirish</button></div>';
    else ft='<div class="ft '+L.st+'"><div class="fm">'+(L.st==="ok"?"✅ Ofarin!":"❌ To‘g‘ri javob:")+'</div><div style="margin-bottom:12px;font-weight:800;display:flex;gap:10px;align-items:center;justify-content:space-between"><span>'+esc(s[1])+'<br><span style="font-weight:700;opacity:.85">'+esc(s[2])+'</span></span>'+spk()+'</div><button class="btn" onclick="nxt('+(L.st==="ok"?1:0)+')">Davom etish</button></div>'}
  $("#app").innerHTML='<div class="top"><button class="x" onclick="home()">✕</button><div class="pg"><i style="width:'+(L.d/L.tot*100)+'%"></i></div><span style="color:'+(L.test?"var(--b)":"var(--r)")+';font-weight:900;font-size:18px">'+(L.test?"TEST":"❤️ "+L.hp)+'</span></div><div class="bd">'+b+'</div>'+ft;if(it.t==="teach")fillScene()}
function ab(j){var it=L.q[L.i];L.pick.push(it.pool.splice(j,1)[0]);draw()}
function ub(j){if(L.st!=="ask")return;var it=L.q[L.i];it.pool.push(L.pick.splice(j,1)[0]);draw()}
function mt(j){var it=L.q[L.i];if(L.st!=="ask"||it.gone[j])return;
  if(it.sel==null||it.sel===j){it.sel=it.sel===j?null:j;return draw()}
  var a=it.cells[it.sel],c=it.cells[j];
  if(a.side===c.side){it.sel=j;return draw()}
  if(a.id===c.id){it.gone[j]=it.gone[it.sel]=1;it.left--;it.sel=null;snd(660);
    if(!it.left){if(it.err){L.hp--}else{L.xp+=10}L.st="ok";if(L.hp<=0){return dead()}}draw()}
  else{it.err++;snd(200,.3);it.bad=[it.sel,j];it.sel=null;draw();setTimeout(function(){it.bad=null;if(L&&L.q[L.i]===it)draw()},450)}}
function markOld(w,ok){var t=today(),key="s"+w.day,rec=S[key]||{v:[],p:0},v=(rec.v||[]).slice(),c=v[w.idx]||[1,t+1];
  c=ok?[Math.min(7,c[0]+1),0]:[1,t+1];if(ok)c[1]=t+IV[c[0]];v[w.idx]=c;var nr={v:v,p:rec.p||0};Store.put(key,nr);S[key]=nr}
function chk(){var it=L.q[L.i],s=it.item,ok;
  if(it.t==="build")ok=norm(L.pick.map(function(p){return p.w}).join(" "))===norm(s[1]);
  else ok=it.o[L.sel]===it.a;
  L.st=ok?"ok":"no";
  if(it.old){markOld(it.old,ok);it.old=null}
  if(ok){snd(660);snd(880,.2);hap(true);L.xp+=10}
  else{snd(200,.3);hap(false);L.err++;
    if(L.test){L.miss.push(it.k)}else{L.hp--;L.q.push(mkEx(it.t,s,it.k));L.tot++}}
  draw()}
function nxt(ok){if(ok)L.d++;L.i++;L.st="ask";L.sel=null;L.pick=[];if(L.hp<=0)return dead();draw()}
function dead(){$("#app").innerHTML='<div class="end"><div class="e">💔</div><h1 style="color:var(--r)">Jonlar tugadi</h1><p>Xafa bo‘lmang, qaytadan urinib ko‘ring!</p><div class="bd"><button class="btn" onclick="start('+L.u+')">Qayta urinish</button><br><br><button class="op" style="text-align:center" onclick="home()">Bosh sahifa</button></div></div>'}
function confetti(){var c="";for(var i=0;i<24;i++)c+='<span class="cf" style="left:'+Math.random()*95+'%;animation-delay:'+Math.random()*.8+'s">'+["🎉","⭐","✨","🟢"][i%4]+'</span>';return c}
function fin(){var g=20+L.xp,u=L.u,t=today();G.xp+=g;bumpStreak();saveG();
  if(u<UN.length){UN[u].k.forEach(function(k){if(!dayRec.v[k])dayRec.v[k]=[1,t+1]})}
  if(u===dayRec.p)dayRec.p=Math.min(dayRec.p+1,UN.length+1);
  saveDay();snd(523);setTimeout(function(){snd(784,.3)},150);
  var last=u>=UN.length;
  $("#app").innerHTML=confetti()+'<div class="end"><div class="e">🏆</div><h1>'+(last?"Kun darsi tugadi!":"Dars tugadi!")+'</h1><div class="stat"><div style="color:#ce82ff">⭐ +'+g+' XP</div><div style="color:#ff9600">🔥 '+G.sk+'</div><div style="color:var(--g)">🎯 '+(L.err?Math.max(0,100-L.err*12):100)+'%</div></div>'+
    (last?'<div class="note">Endi botga qaytib, shu kunning testini bosing.</div>':'')+'<div class="bd"><button class="btn" onclick="home()">Davom etish</button></div></div>'}

/* ============ rasmlar: sc/<blok>.json (100 tadan), yo'q bo'lsa img/<n>.svg, yo'q bo'lsa emoji ============ */
var SCB={};
function scBlock(b){if(!SCB[b])SCB[b]=fetch("sc/"+b+".json").then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return {}});return SCB[b]}
function fillScene(){var el=document.querySelector(".scene[data-n]");if(!el)return;var n=+el.getAttribute("data-n");
  scBlock(Math.floor((n-13)/100)).then(function(j){if(!el.isConnected)return;var v=j[n];
    if(v&&/^<svg[\s>]/.test(v)&&!/<script|\son\w+=|href=/i.test(v)){el.innerHTML=v;el.classList.add("has")}
    else{var im=new Image();im.alt="";im.onload=function(){if(el.isConnected){el.innerHTML="";el.appendChild(im);el.classList.add("has")}};im.src="img/"+n+".svg"}})}
/* ============ test (kun oxirida; natija botga ketadi) ============ */
function startTest(){var T5=["mc","tf","fill","build","uzru"],off=Math.floor(Math.random()*5),q=fixAdj(sh(its.map(function(_,k){return mkEx(T5[(k+off)%5],its[k],k)})));
  L={u:-1,test:true,q:q,i:0,d:0,tot:q.length,hp:99,st:"ask",sel:null,pick:[],xp:0,err:0,miss:[]};draw()}
function finTest(){var N=its.length,miss=L.miss.filter(function(k,i,a){return a.indexOf(k)===i}),score=N-miss.length,r=score/N,pass=r>=PASS,st=r>=.9?3:pass?2:r>=.5?1:0,t=today();
  its.forEach(function(_,k){if(miss.indexOf(k)>=0)dayRec.v[k]=[1,t+1];else if(!dayRec.v[k])dayRec.v[k]=[1,t+1]});saveDay();
  var C=2*Math.PI*60,svg='<svg width="150" height="150"><circle cx="75" cy="75" r="60" fill="none" stroke="var(--bd)" stroke-width="14"/><circle cx="75" cy="75" r="60" fill="none" stroke="'+(pass?"#58cc02":"#ff4b4b")+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-r))+'"/></svg>';
  var ms=miss.map(function(k){return '<div><div class="ru" style="font-size:18px">'+esc(its[k][1])+'</div><div class="tr" style="margin:2px 0 0">'+esc(its[k][2])+'</div></div>'}).join("");
  var can=inTG&&Number.isInteger(LID),payload=JSON.stringify({l:LID,s:score,n:N});window.__payload=payload;
  snd(pass?523:200);
  $("#app").innerHTML=(pass?confetti():"")+'<div class="bd end" style="padding-top:20px"><div class="ring">'+svg+'<b>'+Math.round(r*100)+'%</b></div><div class="stars">'+"★".repeat(st)+"☆".repeat(3-st)+'</div><h1 style="color:var(--tx);font-size:26px">'+(pass?"Test topshirildi! 🎉":"Yana bir urinib ko‘ring")+'</h1>'+
    '<div class="stat"><div style="color:var(--g)">✅ '+score+'</div><div style="color:var(--r)">❌ '+(N-score)+'</div></div>'+(miss.length?'<div class="note" style="text-align:left">Xato qilingan gaplar:</div><div class="miss">'+ms+'</div>':'')+
    (can?'<button class="btn" id="sendb">Natijani botga yuborish</button>':'<div class="note">Bu test Telegram bot tugmasi orqali ochilishi kerak, aks holda natija botga yetmaydi.</div>')+'</div>';
  var sb=document.getElementById("sendb");if(sb)sb.onclick=function(){sb.disabled=true;try{tg.sendData(payload)}catch(e){sb.disabled=false}}}

/* ============ boshlash ============ */
function init(){
  if(!DAYS.length||!DAYS[DAY-1]){$("#app").innerHTML='<div class="end"><div class="e">🦊</div><h1>Dars topilmadi</h1><p class="note">Botdagi tugma orqali oching.</p></div>';return}
  $("#app").innerHTML='<div class="end"><div class="e">🦊</div><p class="note">Yuklanmoqda…</p></div>';
  Store.all().then(function(m){S=m;if(m.g){G.xp=m.g.xp||0;G.sk=m.g.sk||0;G.last=m.g.last||0}
    var day=DAYS[DAY-1];
    if(day){its=day.i;var n=its.length,k=Math.ceil(n/4),b=Math.floor(n/k),e=n%k,p=0,E=["🌱","🌿","🌳","🍀"];
      for(var i=0;i<k;i++){var sz=b+(i<e?1:0),ks=[];for(var j=0;j<sz;j++)ks.push(p+j);p+=sz;UN.push({k:ks,e:E[i%4],n:"Dars "+(i+1)})}
      var r=S["s"+DAY];dayRec={v:(r&&r.v)||[],p:(r&&r.p)||0}}
    if(TESTMODE&&day)return startTest();
    OLD=dueAll().filter(function(w){return w.day!==DAY}).slice(0,3);
    home()})}
init();
</script></body></html>
