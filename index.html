<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RuMio · Kunlik dars</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--bg:#fff;--tx:#3c3c3c;--mut:#777;--bd:#e5e5e5;--g:#58cc02;--gd:#46a302;--b:#1cb0f6;--bd2:#1899d6;--r:#ff4b4b;--rl:#ffdfe0;--gl:#d7ffb8;--sel:#ddf4ff;color-scheme:light}
html{height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--tx:#f1f7fb;--mut:#9fb0ba;--bd:#37464f;--rl:#4a2326;--gl:#25410f;--sel:#1b3a4b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131f24;--tx:#f1f7fb;--mut:#9fb0ba;--bd:#37464f;--rl:#4a2326;--gl:#25410f;--sel:#1b3a4b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.hd{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:2px solid var(--bd);font-size:18px;font-weight:900;z-index:5}
.hd .y{color:#ff9600}.hd .p{color:#ce82ff}.hd .h{color:var(--r)}
.unit{margin:16px;padding:16px;border-radius:16px;background:var(--g);color:#fff}.unit small{opacity:.92;font-weight:800;letter-spacing:.04em}.unit h2{margin:2px 0 0;font-size:21px;font-weight:900;line-height:1.25}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:30px 0 60px}
.nd{width:84px;height:76px;border-radius:50%;border:0;border-bottom:8px solid var(--gd);background:var(--g);font-size:36px;cursor:pointer;position:relative;font-family:inherit}
.nd:active{transform:translateY(4px);border-bottom-width:4px}
.nd.lock{background:var(--bd);border-bottom-color:#c4c4c4;filter:grayscale(1);cursor:not-allowed}
.nd.cur{animation:bob 1.2s infinite}.nd.done{background:#ffc800;border-bottom-color:#d8a700}
.nd .s{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:3px 10px;font-size:14px;font-weight:900;color:var(--g);white-space:nowrap}
.lb{font-size:13px;color:var(--mut);text-align:center;margin-top:4px;max-width:140px}
@keyframes bob{50%{transform:translateY(-6px)}}
.top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
.x{background:none;border:0;font-size:26px;color:var(--mut);cursor:pointer;font-family:inherit}
.pg{flex:1;height:16px;background:var(--bd);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .35s}
.bd{flex:1;padding:8px 20px 20px;overflow:auto}
.q{font-size:24px;font-weight:900;margin:8px 0 16px}
.owl{display:flex;gap:12px;align-items:flex-end;margin-bottom:14px}.owl .o{font-size:64px;line-height:1}
.bub{border:2px solid var(--bd);border-radius:16px;padding:12px 14px;font-size:17px;position:relative}
.ru{font-size:30px;font-weight:900;display:flex;gap:10px;align-items:center;flex-wrap:wrap;line-height:1.25}
.spk{width:48px;height:48px;border-radius:14px;border:0;border-bottom:4px solid var(--bd2);background:var(--b);color:#fff;font-size:22px;cursor:pointer;flex:none}
.tr{color:var(--mut);margin:8px 0}.uz{color:var(--b);font-size:22px;font-weight:900}
.when{background:#fff4cc;color:#5b4500;border-radius:14px;padding:12px;margin-top:14px;font-size:15px}
.op{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border:2px solid var(--bd);border-bottom-width:5px;border-radius:16px;background:var(--bg);color:var(--tx);font:inherit;font-size:18px;cursor:pointer}
.op.sel{border-color:var(--b);background:var(--sel);color:var(--b)}
.op.ok{border-color:var(--g);background:var(--gl);color:var(--gd)}.op.no{border-color:var(--r);background:var(--rl);color:var(--r)}
.ans,.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:8px 0}
.ans{border-top:2px solid var(--bd);border-bottom:2px solid var(--bd);margin:12px 0;padding:12px 0}
.tl{padding:10px 14px;border:2px solid var(--bd);border-bottom-width:5px;border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;font-size:19px;cursor:pointer}
.ft{padding:16px 20px calc(16px + env(safe-area-inset-bottom));border-top:2px solid var(--bd)}
.ft.ok{background:var(--gl);border-color:transparent}.ft.no{background:var(--rl);border-color:transparent}
.fm{font-size:20px;font-weight:900;margin-bottom:10px}.ft.ok .fm{color:var(--gd)}.ft.no .fm{color:var(--r)}
.btn{width:100%;padding:15px;border:0;border-bottom:5px solid var(--gd);border-radius:16px;background:var(--g);color:#fff;font:inherit;font-size:17px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;cursor:pointer}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{background:var(--bd);border-bottom-color:#c4c4c4;color:var(--mut);cursor:default}
.ft.no .btn{background:var(--r);border-bottom-color:#d33}
.end{text-align:center;padding-top:40px}.end .e{font-size:90px}.end h1{font-size:30px;margin:10px 0;color:#ffc800}
.stat{display:flex;gap:12px;justify-content:center;margin:20px 0;flex-wrap:wrap}.stat div{border:2px solid var(--bd);border-radius:16px;padding:10px 18px;font-size:20px;font-weight:900}
.cf{position:fixed;top:-40px;font-size:28px;animation:fall 2.4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.mic{width:84px;height:84px;border-radius:50%;border:0;border-bottom:6px solid var(--bd2);background:var(--b);color:#fff;font-size:38px;cursor:pointer}
.mg{margin-top:12px;color:var(--mut);min-height:44px}.btn.sk{background:var(--bd);border-bottom-color:#c4c4c4;color:var(--mut)}
.rv{display:block;width:calc(100% - 32px);margin:12px 16px 0;padding:14px 16px;border:2px solid #ce82ff;border-bottom-width:5px;border-radius:16px;background:var(--bg);color:var(--tx);font:inherit;font-size:18px;text-align:left;cursor:pointer}.rv small{color:var(--mut);font-weight:700;font-size:14px}
.rv.hot{background:#f4e9ff;color:#3d2466}.rv.hot small{color:#6b4a99}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gr{padding:12px 4px;border:2px solid;border-bottom-width:5px;border-radius:14px;background:var(--bg);font:inherit;font-weight:900;font-size:15px;cursor:pointer}.gr.r{border-color:var(--r);color:var(--r)}.gr.y{border-color:#ff9600;color:#ff9600}.gr.g{border-color:var(--g);color:var(--gd)}
.mr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:2px solid var(--bd);font-size:15px}.mr span:last-child{color:var(--mut);white-space:nowrap}
.ring{width:150px;height:150px;margin:6px auto 0;position:relative}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900}
.stars{font-size:38px;letter-spacing:6px;margin:6px 0;color:#ffc800}
.miss{text-align:left;border:2px solid var(--bd);border-radius:14px;padding:4px 14px;margin:8px 0}.miss div{padding:10px 0;border-bottom:1px solid var(--bd)}.miss div:last-child{border:0}
.note{color:var(--mut);font-size:15px;margin:10px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>
<script src="data.js"></script>
<script>
"use strict";
/* ============ sozlamalar ============ */
var IV=[0,1,3,7,16,35,70,140];          // takrorlash oraliqlari (kun)
var MAXREV=10;                          // bir martada ko'pi bilan nechta takrorlash
var Q=new URLSearchParams(location.search);
var DAY=parseInt(Q.get("d"),10);
var TESTMODE=Q.get("m")==="test",OLD=[];
var LID=Q.get("l")===null||Q.get("l")===""?NaN:Number(Q.get("l")),PASS=0.7;
var tg=window.Telegram&&Telegram.WebApp,inTG=!!(tg&&tg.platform&&tg.platform!=="unknown");
try{if(tg){tg.ready();tg.expand();if(tg.colorScheme)document.documentElement.setAttribute("data-theme",tg.colorScheme)}}catch(e){}
var DAYS=window.DAYS||[];
var $=function(s){return document.querySelector(s)};
function sh(a){return a.slice().sort(function(){return Math.random()-.5})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return Math.floor((Date.now()-d.getTimezoneOffset()*6e4)/864e5)}
function norm(s){return s.toLowerCase().replace(/ё/g,"е").replace(/[.,!?;:"«»()—–\-…]/g," ").replace(/\s+/g," ").trim()}
function words(s){return s.split(/\s+/).filter(Boolean)}

/* ============ rus -> lotin (taxminiy o'qilishi) ============ */
var TR={а:"a",б:"b",в:"v",г:"g",д:"d",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"kh",ц:"ts",ч:"ch",ш:"sh",щ:"shch",ъ:"",ь:"",ы:"i",э:"e",ю:"yu",я:"ya",ё:"yo"};
function trl(s){var o="",prev=" ";for(var i=0;i<s.length;i++){var ch=s[i],lo=ch.toLowerCase(),t;
  if(lo==="е"){t=(" aeiouаеёиоуыэюя'ьъ".indexOf(prev.toLowerCase())>=0||/[^а-яёa-z]/i.test(prev))?"ye":"e"}
  else if(TR[lo]!==undefined)t=TR[lo];else t=ch;
  if(ch!==lo&&t)t=t[0].toUpperCase()+t.slice(1);o+=t;prev=ch}return o}

/* ============ tovush ============ */
function snd(f,d){d=d||.15;try{var c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type="triangle";g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
var VOICE=null;
function pickVoice(){try{VOICE=speechSynthesis.getVoices().filter(function(x){return /^ru/i.test(x.lang)})[0]||null}catch(e){}}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function sayT(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="ru-RU";if(VOICE)u.voice=VOICE;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function hap(ok){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred(ok?"success":"error")}catch(e){}}

/* ============ saqlash: Telegram CloudStorage + localStorage ============ */
var Store={
  cloud:function(){try{return inTG&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.9")?tg.CloudStorage:null}catch(e){return null}},
  loadLocal:function(){try{return JSON.parse(localStorage.getItem("rm_srs2")||"{}")}catch(e){return {}}},
  saveLocal:function(m){try{localStorage.setItem("rm_srs2",JSON.stringify(m))}catch(e){}},
  all:function(){var self=this;return new Promise(function(res){
    var loc=self.loadLocal(),c=self.cloud();if(!c)return res(loc);
    var done=false,t=setTimeout(function(){if(!done){done=true;res(loc)}},3500);
    function fin(v){if(!done){done=true;clearTimeout(t);res(v)}}
    try{c.getKeys(function(e,keys){if(e||!keys||!keys.length)return fin(loc);
      keys=keys.filter(function(k){return /^s\d+$/.test(k)||k==="g"});
      c.getItems(keys,function(e2,o){var m=Object.assign({},loc);
        if(!e2&&o)for(var k in o){try{var r=JSON.parse(o[k]);if(!m[k]||(r.t||0)>(m[k].t||0))m[k]=r}catch(x){}}
        self.saveLocal(m);fin(m)})})}catch(x){fin(loc)}})},
  put:function(key,rec){rec.t=Date.now();var m=this.loadLocal();m[key]=rec;this.saveLocal(m);
    var c=this.cloud();if(c){try{c.setItem(key,JSON.stringify(rec),function(){})}catch(e){}}return m}
};

/* ============ holat ============ */
var S={},G={xp:0,sk:0,last:0};
var its=[],UN=[],dayRec={v:[],p:0};
var L=null,R=null,POOL=[];
DAYS.forEach(function(d){d.i.forEach(function(x){POOL.push(x)})});
function saveDay(){Store.put("s"+DAY,{v:dayRec.v,p:dayRec.p});S["s"+DAY]={v:dayRec.v,p:dayRec.p}}
function saveG(){Store.put("g",{xp:G.xp,sk:G.sk,last:G.last})}
function bumpStreak(){var t=today();if(G.last===t)return;G.sk=(G.last===t-1)?G.sk+1:1;G.last=t}
function dueAll(){var t=today(),out=[];
  Object.keys(S).forEach(function(k){if(!/^s\d+$/.test(k))return;var d=+k.slice(1),day=DAYS[d-1];if(!day)return;var v=S[k].v||[];
    for(var i=0;i<day.i.length;i++){var r=v[i];if(r&&r[1]<=t)out.push({day:d,idx:i,over:t-r[1],it:day.i[i]})}});
  out.sort(function(a,b){return b.over-a.over});return out}
function learnedAll(){var out=[];Object.keys(S).forEach(function(k){if(!/^s\d+$/.test(k))return;var d=+k.slice(1),day=DAYS[d-1];if(!day)return;var v=S[k].v||[];
  for(var i=0;i<day.i.length;i++)if(v[i])out.push({day:d,idx:i,it:day.i[i]})});return out}

/* ============ bosh sahifa (yo'l xaritasi) ============ */
function home(){L=null;
  var day=DAYS[DAY-1];
  var nodes=UN.map(function(u,i){var st=i<dayRec.p?"done":i===dayRec.p?"cur":"lock";return node(i,st,u.e,u.n)});
  var mst=dayRec.p>UN.length?"done":dayRec.p===UN.length?"cur":"lock";nodes.push(node(UN.length,mst,"🏆","Yakuniy test"));
  $("#app").innerHTML='<div class="hd"><span class="y">🔥 '+G.sk+'</span><span class="p">⭐ '+G.xp+' XP</span><span class="h">❤️ 5</span></div>'+
    '<div class="unit"><small>'+day.lv+' · KUN '+DAY+'</small><h2>'+esc(day.t)+' ('+day.p+'/'+day.k+')</h2></div>'+
    '<div class="path">'+nodes.join("")+'</div>'+
    (dayRec.p>UN.length?'<div class="bd"><div class="note" style="text-align:center">🎉 Bugungi dars tayyor! Botga qaytib, shu kunning testini bosing.</div></div>':'')}
function node(i,st,e,name){var off=[0,50,-45,40,0,-30][i%6];
  return '<div style="transform:translateX('+off+'px);text-align:center"><button class="nd '+st+'" '+(st==="lock"?"":'onclick="start('+i+')"')+'>'+(st==="cur"?'<span class="s">BOSHLASH</span>':'')+(st==="done"?"⭐":e)+'</button><div class="lb">'+esc(name)+'</div></div>'}

/* ============ dars tuzish ============ */
function distract(item,field,n){var Ln=item[field].length;
  var c=POOL.filter(function(x){return x[0]!==item[0]&&x[field]!==item[field]&&Math.abs(x[field].length-Ln)<=Math.max(8,Ln*.5)});
  if(c.length<n)c=POOL.filter(function(x){return x[0]!==item[0]});return sh(c).slice(0,n).map(function(x){return x[field]})}
function mcI(it,t){var f=t==="uzru"?1:2;return {t:t,item:it,o:sh([it[f]].concat(distract(it,f,3)))}}
function buildI(it){var w=words(it[1]);if(w.length<3)return mcI(it,"uzru");
  var ex=[];sh(POOL).some(function(x){words(x[1]).forEach(function(z){if(ex.length<2&&w.indexOf(z)<0&&ex.indexOf(z)<0&&z.length>1)ex.push(z)});return ex.length>=2});
  return {t:"build",item:it,pool:sh(w.concat(ex).map(function(x,i){return {w:x,i:i}}))}}
function exMC(k,t){var e=mcI(its[k],t);e.k=k;return e}
function exBuild(k){var e=buildI(its[k]);e.k=k;return e}
function exOld(w){var e=Math.random()<.5?mcI(w.it,"mc"):buildI(w.it);e.old=w;e.k=-1;return e}
function mk(u){var q=[];
  if(u<UN.length){var ks=UN[u].k;
    ks.forEach(function(k){q.push({t:"teach",k:k,item:its[k]})});
    var a=sh(ks.map(function(k){return exMC(k,"mc")})),b=sh(ks.map(function(k){return exBuild(k)}));
    if(OLD[u])b.splice(Math.floor(Math.random()*(b.length+1)),0,exOld(OLD[u]));
    q=q.concat(a,b)}
  else{q=sh(its.map(function(_,k){var r=Math.floor(Math.random()*3);return r===0?exMC(k,"mc"):r===1?exMC(k,"uzru"):exBuild(k)}))}
  return q}
function start(u){var q=mk(u);L={u:u,q:q,i:0,d:0,tot:q.length,hp:5,st:"ask",sel:null,pick:[],xp:0,err:0};draw()}

function draw(){var it=L.q[L.i];if(!it)return L.test?finTest():fin();var s=it.item,b="",ft="";
  if(it.t==="teach"){var nT=L.q.filter(function(x){return x.t==="teach"}).length;
    b='<div class="owl"><div class="o">🦊</div><div class="bub">Yangi gap '+(L.i+1)+'/'+nT+'</div></div><div class="ru">'+esc(s[1])+'<button class="spk" onclick="sayT(L.q[L.i].item[1])" aria-label="Eshitish">🔊</button></div><div class="tr">🗣 '+esc(trl(s[1]))+'</div><div class="uz">'+esc(s[2])+'</div><div class="when">📍 <b>Mavzu:</b> '+esc(DAYS[DAY-1].t)+'</div>';
    ft='<div class="ft"><button class="btn" onclick="nxt(1)">Tushunarli</button></div>'}
  else{
    if(it.t==="build"){
      b='<div class="q">Ruscha tuzing</div><div class="uz" style="margin-bottom:6px">'+esc(s[2])+'</div><div class="ans">'+L.pick.map(function(p,j){return '<button class="tl" onclick="ub('+j+')">'+esc(p.w)+'</button>'}).join("")+'</div><div class="bank">'+it.pool.map(function(p,j){return '<button class="tl" onclick="ab('+j+')">'+esc(p.w)+'</button>'}).join("")+'</div>'}
    else{var title=it.t==="mc"?"Bu o‘zbekchada nima?":"Ruscha qanday aytiladi?";
      var head=it.t==="mc"?'<div class="ru" style="margin-bottom:16px">'+esc(s[1])+'</div>':'<div class="bub" style="margin-bottom:16px;font-size:20px">'+esc(s[2])+'</div>';
      var ans=it.t==="uzru"?s[1]:s[2];
      b='<div class="q">'+title+'</div>'+head+it.o.map(function(o,j){var cls=L.st==="ask"?(L.sel===j?"sel":""):(o===ans?"ok":(L.sel===j?"no":""));
        return '<button class="op '+cls+'" '+(L.st==="ask"?'onclick="L.sel='+j+';draw()"':'')+'>'+esc(o)+'</button>'}).join("")}
    var ready=it.t==="build"?L.pick.length>0:L.sel!=null;
    if(L.st==="ask")ft='<div class="ft"><button class="btn" '+(ready?"":"disabled")+' onclick="chk()">Tekshirish</button></div>';
    else ft='<div class="ft '+L.st+'"><div class="fm">'+(L.st==="ok"?"✅ Ofarin!":"❌ To‘g‘ri javob:")+'</div>'+(L.st==="no"?'<div style="margin-bottom:12px;font-weight:800">'+esc(s[1])+'<br>'+esc(s[2])+'</div>':'')+'<button class="btn" onclick="nxt('+(L.st==="ok"?1:0)+')">Davom etish</button></div>'}
  $("#app").innerHTML='<div class="top"><button class="x" onclick="home()">✕</button><div class="pg"><i style="width:'+(L.d/L.tot*100)+'%"></i></div><span style="color:'+(L.test?"var(--b)":"var(--r)")+';font-weight:900;font-size:18px">'+(L.test?"TEST":"❤️ "+L.hp)+'</span></div><div class="bd">'+b+'</div>'+ft}
function ab(j){var it=L.q[L.i];L.pick.push(it.pool.splice(j,1)[0]);draw()}
function ub(j){if(L.st!=="ask")return;var it=L.q[L.i];it.pool.push(L.pick.splice(j,1)[0]);draw()}
function markOld(w,ok){var t=today(),key="s"+w.day,rec=S[key]||{v:[],p:0},v=(rec.v||[]).slice(),c=v[w.idx]||[1,t+1];
  c=ok?[Math.min(7,c[0]+1),0]:[1,t+1];if(ok)c[1]=t+IV[c[0]];v[w.idx]=c;var nr={v:v,p:rec.p||0};Store.put(key,nr);S[key]=nr}
function chk(){var it=L.q[L.i],s=it.item,ok;
  if(it.t==="build")ok=norm(L.pick.map(function(p){return p.w}).join(" "))===norm(s[1]);
  else ok=it.o[L.sel]===(it.t==="uzru"?s[1]:s[2]);
  L.st=ok?"ok":"no";
  if(it.old){markOld(it.old,ok);it.old=null}
  if(ok){snd(660);snd(880,.2);hap(true);L.xp+=10}
  else{snd(200,.3);hap(false);L.err++;
    if(L.test){L.miss.push(it.k)}else{L.hp--;var c=it.t==="build"?buildI(s):mcI(s,it.t);c.k=it.k;L.q.push(c);L.tot++}}
  draw()}
function nxt(ok){if(ok)L.d++;L.i++;L.st="ask";L.sel=null;L.pick=[];if(L.hp<=0)return dead();draw()}
function dead(){$("#app").innerHTML='<div class="end"><div class="e">💔</div><h1 style="color:var(--r)">Jonlar tugadi</h1><p>Xafa bo‘lmang, takrorlash eng yaxshi o‘qituvchi!</p><div class="bd"><button class="btn" onclick="start('+L.u+')">Qayta urinish</button><br><br><button class="op" style="text-align:center" onclick="home()">Bosh sahifa</button></div></div>'}
function confetti(){var c="";for(var i=0;i<24;i++)c+='<span class="cf" style="left:'+Math.random()*95+'%;animation-delay:'+Math.random()*.8+'s">'+["🎉","⭐","✨","🟢"][i%4]+'</span>';return c}
function fin(){var g=20+L.xp,u=L.u,t=today();G.xp+=g;bumpStreak();saveG();
  if(u<UN.length){UN[u].k.forEach(function(k){if(!dayRec.v[k])dayRec.v[k]=[1,t+1]})}
  if(u===dayRec.p)dayRec.p=Math.min(dayRec.p+1,UN.length+1);
  saveDay();snd(523);setTimeout(function(){snd(784,.3)},150);
  var last=u>=UN.length;
  $("#app").innerHTML=confetti()+'<div class="end"><div class="e">🏆</div><h1>'+(last?"Kun darsi tugadi!":"Dars tugadi!")+'</h1><div class="stat"><div style="color:#ce82ff">⭐ +'+g+' XP</div><div style="color:#ff9600">🔥 '+G.sk+'</div><div style="color:var(--g)">🎯 '+(L.err?Math.max(0,100-L.err*12):100)+'%</div></div>'+
    (last?'<div class="note">Endi botga qaytib, shu kunning testini bosing.</div>':'')+'<div class="bd"><button class="btn" onclick="home()">Davom etish</button></div></div>'}

/* ============ test (kun oxirida; natija botga ketadi) ============ */
function startTest(){var q=its.map(function(_,k){var r=Math.floor(Math.random()*3);return r===0?exMC(k,"mc"):r===1?exMC(k,"uzru"):exBuild(k)});q=sh(q);
  L={u:-1,test:true,q:q,i:0,d:0,tot:q.length,hp:99,st:"ask",sel:null,pick:[],xp:0,err:0,miss:[]};draw()}
function finTest(){var N=its.length,miss=L.miss.filter(function(k,i,a){return a.indexOf(k)===i}),score=N-miss.length,r=score/N,pass=r>=PASS,st=r>=.9?3:pass?2:r>=.5?1:0,t=today();
  its.forEach(function(_,k){if(miss.indexOf(k)>=0)dayRec.v[k]=[1,t+1];else if(!dayRec.v[k])dayRec.v[k]=[1,t+1]});saveDay();
  var C=2*Math.PI*60,svg='<svg width="150" height="150"><circle cx="75" cy="75" r="60" fill="none" stroke="var(--bd)" stroke-width="14"/><circle cx="75" cy="75" r="60" fill="none" stroke="'+(pass?"#58cc02":"#ff4b4b")+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-r))+'"/></svg>';
  var ms=miss.map(function(k){return '<div><div class="ru" style="font-size:18px">'+esc(its[k][1])+'</div><div class="tr" style="margin:2px 0 0">'+esc(its[k][2])+'</div></div>'}).join("");
  var can=inTG&&Number.isInteger(LID),payload=JSON.stringify({l:LID,s:score,n:N});window.__payload=payload;
  snd(pass?523:200);
  $("#app").innerHTML=(pass?confetti():"")+'<div class="bd end" style="padding-top:20px"><div class="ring">'+svg+'<b>'+Math.round(r*100)+'%</b></div><div class="stars">'+"★".repeat(st)+"☆".repeat(3-st)+'</div><h1 style="color:var(--tx);font-size:26px">'+(pass?"Test topshirildi! 🎉":"Yana bir urinib ko‘ring")+'</h1>'+
    '<div class="stat"><div style="color:var(--g)">✅ '+score+'</div><div style="color:var(--r)">❌ '+(N-score)+'</div></div>'+(miss.length?'<div class="note" style="text-align:left">Xato qilingan gaplar:</div><div class="miss">'+ms+'</div>':'')+
    (can?'<button class="btn" id="sendb">Natijani botga yuborish</button>':'<div class="note">Bu test Telegram bot tugmasi orqali ochilishi kerak, aks holda natija botga yetmaydi.</div>')+'</div>';
  var sb=document.getElementById("sendb");if(sb)sb.onclick=function(){sb.disabled=true;try{tg.sendData(payload)}catch(e){sb.disabled=false}}}

/* ============ boshlash ============ */
function init(){
  if(!DAYS.length||!DAYS[DAY-1]){$("#app").innerHTML='<div class="end"><div class="e">🦊</div><h1>Dars topilmadi</h1><p class="note">Botdagi tugma orqali oching.</p></div>';return}
  $("#app").innerHTML='<div class="end"><div class="e">🦊</div><p class="note">Yuklanmoqda…</p></div>';
  Store.all().then(function(m){S=m;if(m.g){G.xp=m.g.xp||0;G.sk=m.g.sk||0;G.last=m.g.last||0}
    var day=DAYS[DAY-1];
    if(day){its=day.i;var n=its.length,k=Math.ceil(n/4),b=Math.floor(n/k),e=n%k,p=0,E=["🌱","🌿","🌳","🍀"];
      for(var i=0;i<k;i++){var sz=b+(i<e?1:0),ks=[];for(var j=0;j<sz;j++)ks.push(p+j);p+=sz;UN.push({k:ks,e:E[i%4],n:"Dars "+(i+1)})}
      var r=S["s"+DAY];dayRec={v:(r&&r.v)||[],p:(r&&r.p)||0}}
    if(TESTMODE&&day)return startTest();
    OLD=dueAll().filter(function(w){return w.day!==DAY}).slice(0,3);
    home()})}
init();
</script></body></html>
