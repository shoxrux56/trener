<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.nd{width:84px;height:76px;border-radius:50%;border:0;border-bottom:8px solid var(--gd);background:var(--g);font-size:36px;cursor:pointer;position:relative;font-family:inherit}

.fm{font-size:20px;font-weight:900;margin-bottom:10px}.ft.ok .fm{color:var(--gd)}.ft.no .fm{color:var(--r)}
.btn{width:100%;padding:15px;border:0;border-bottom:5px solid var(--gd);border-radius:16px;background:var(--g);color:#fff;font:inherit;font-size:17px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;cursor:pointer}

.stat{display:flex;gap:12px;justify-content:center;margin:20px 0;flex-wrap:wrap}.stat div{border:2px solid var(--bd);border-radius:16px;padding:10px 18px;font-size:20px;font-weight:900}

.mic{width:84px;height:84px;border-radius:50%;border:0;border-bottom:6px solid var(--bd2);background:var(--b);color:#fff;font-size:38px;cursor:pointer}
.mg{margin-top:12px;color:var(--mut);min-height:44px}.btn.sk{background:var(--bd);border-bottom-color:#c4c4c4;color:var(--mut)}
.rv{display:block;width:calc(100% - 32px);margin:12px 16px 0;padding:14px 16px;border:2px solid #ce82ff;border-bottom-width:5px;border-radius:16px;background:var(--bg);color:var(--tx);font:inherit;font-size:18px;text-align:left;cursor:pointer}.rv small{color:var(--mut);font-weight:700;font-size:14px}
.rv.hot{background:#f4e9ff;color:#3d2466}.rv.hot small{color:#6b4a99}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gr{padding:12px 4px;border:2px solid;border-bottom-width:5px;border-radius:14px;background:var(--bg);font:inherit;font-weight:900;font-size:15px;cursor:pointer}.gr.r{border-color:var(--r);color:var(--r)}.gr.y{border-color:#ff9600;color:#ff9600}.gr.g{border-color:var(--g);color:var(--gd)}
.mr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:2px solid var(--bd);font-size:15px}.mr span:last-child{color:var(--mut);white-space:nowrap}
.ring{width:150px;height:150px;margin:6px auto 0;position:relative}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900}
.stars{font-size:38px;letter-spacing:6px;margin:6px 0;color:#ffc800}
.miss{text-align:left;border:2px solid var(--bd);border-radius:14px;padding:4px 14px;margin:8px 0}.miss>div{padding:10px 0;border-bottom:1px solid var(--bd)}.miss>div:last-child{border:0}
.scene{font-size:64px;text-align:center;background:var(--sel);border-radius:24px;padding:18px 10px;margin:4px 0 16px;line-height:1.2;letter-spacing:6px}
.tfbox{background:var(--sel);color:var(--bd2);border-radius:14px;padding:12px 16px;font-size:20px;font-weight:800;margin-bottom:16px}.tfbox small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.scene.has{padding:0;background:none;letter-spacing:0;line-height:0}.scene.has .em{display:none}.scene img,.scene svg{display:block;width:100%;height:auto;border-radius:24px}
.mini{font-size:34px;margin-bottom:6px;line-height:1.1}
.unit .sit{margin-top:8px;font-size:15px;font-weight:700;opacity:.95}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mtc{margin:0!important;text-align:center!important;font-size:16px!important;min-height:64px;display:flex;align-items:center;justify-content:center}.op.gone{visibility:hidden}
.note{color:var(--mut);font-size:15px;margin:10px 0}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:6px}
.sec{font-size:18px;font-weight:900;margin:22px 0 6px}.sub{color:var(--mut);font-size:14px;margin:0 0 8px}
.chip{display:inline-block;font-size:12px;font-weight:800;border-radius:8px;padding:2px 8px;margin-right:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>

<script>
"use strict";
/* ============ sozlamalar ============ */
var IV=[0,1,3,7,16,35,70,140];          // takrorlash oraliqlari (kun)
var COURSE=15;                          // kurs tuzilmasi versiyasi (kunlar qayta bo'lingan)
var MAXREV=12,MAXIV=180,REVN=12;        // bir martada nechta takrorlash; eng uzun oraliq (kun)
var REVMODE=new URLSearchParams(location.search).get("m")==="review";
var Q=new URLSearchParams(location.search);
var DAY=parseInt(Q.get("d"),10);
var TESTMODE=Q.get("m")==="test",OLD=[],OLDPER=2;
var LID=Q.get("l")===null||Q.get("l")===""?NaN:Number(Q.get("l")),PASS=0.7;
var tg=window.Telegram&&Telegram.WebApp,inTG=!!(tg&&tg.platform&&tg.platform!=="unknown");
try{if(tg){tg.ready();tg.expand();if(tg.colorScheme)document.documentElement.setAttribute("data-theme",tg.colorScheme)}}catch(e){}
var DAYS=window.DAYS||[];
var $=function(s){return document.querySelector(s)};
function sh(a){return a.slice().sort(function(){return Math.random()-.5})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return Math.floor((Date.now()-d.getTimezoneOffset()*6e4)/864e5)}
function norm(s){return s.toLowerCase().replace(/ё/g,"е").replace(/[.,!?;:"«»()—–\-…]/g," ").replace(/\s+/g," ").trim()}
function words(s){return s.split(/\s+/).filter(Boolean)}

/* ============ rus -> lotin (taxminiy o'qilishi) ============ */
var TR={а:"a",б:"b",в:"v",г:"g",д:"d",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"kh",ц:"ts",ч:"ch",ш:"sh",щ:"shch",ъ:"",ь:"",ы:"i",э:"e",ю:"yu",я:"ya",ё:"yo"};
function trl(s){var o="",prev=" ";for(var i=0;i<s.length;i++){var ch=s[i],lo=ch.toLowerCase(),t;
  if(lo==="е"){t=(" aeiouаеёиоуыэюя'ьъ".indexOf(prev.toLowerCase())>=0||/[^а-яёa-z]/i.test(prev))?"ye":"e"}
  else if(TR[lo]!==undefined)t=TR[lo];else t=ch;
  if(ch!==lo&&t)t=t[0].toUpperCase()+t.slice(1);o+=t;prev=ch}return o}

/* ============ tovush ============ */
function snd(f,d){d=d||.15;try{var c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type="triangle";g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
var VOICE=null;
function pickVoice(){try{VOICE=speechSynthesis.getVoices().filter(function(x){return /^ru/i.test(x.lang)})[0]||null}catch(e){}}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function sayT(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="ru-RU";if(VOICE)u.voice=VOICE;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function hap(ok){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred(ok?"success":"error")}catch(e){}}

/* ============ saqlash: Telegram CloudStorage + localStorage ============ */
var Store={
  cloud:function(){try{return inTG&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.9")?tg.CloudStorage:null}catch(e){return null}},
  loadLocal:function(){try{return JSON.parse(localStorage.getItem("rm_srs2")||"{}")}catch(e){return {}}},
  saveLocal:function(m){try{localStorage.setItem("rm_srs2",JSON.stringify(m))}catch(e){}},
  all:function(){var self=this;return new Promise(function(res){
    var loc=self.loadLocal(),c=self.cloud();if(!c)return res(loc);
    var done=false,t=setTimeout(function(){if(!done){done=true;res(loc)}},3500);
    function fin(v){if(!done){done=true;clearTimeout(t);res(v)}}
    try{c.getKeys(function(e,keys){if(e||!keys||!keys.length)return fin(loc);
      keys=keys.filter(function(k){return /^s\d+$/.test(k)||k==="g"});
      c.getItems(keys,function(e2,o){var m=Object.assign({},loc);
        if(!e2&&o)for(var k in o){try{var r=JSON.parse(o[k]);if(!m[k]||(r.t||0)>(m[k].t||0))m[k]=r}catch(x){}}
        self.saveLocal(m);fin(m)})})}catch(x){fin(loc)}})},
  put:function(key,rec){rec.t=Date.now();var m=this.loadLocal();m[key]=rec;this.saveLocal(m);
    var c=this.cloud();if(c){try{c.setItem(key,JSON.stringify(rec),function(){})}catch(e){}}return m}
};

/* ============ holat ============ */
var S={},G={gr:{},xp:0,sk:0,last:0,ty:{},lg:[0,0,0,0,0],wk:{}};
var its=[],UN=[],dayRec={v:[],p:0};
var L=null,R=null,POOL=[];
DAYS.forEach(function(d){d.i.forEach(function(x){POOL.push(x)})});
function saveDay(){Store.put("s"+DAY,{v:dayRec.v,p:dayRec.p,ver:COURSE});S["s"+DAY]={v:dayRec.v,p:dayRec.p,ver:COURSE}}
function saveG(){Store.put("g",{gr:G.gr,xp:G.xp,sk:G.sk,last:G.last,ty:G.ty,lg:G.lg,wk:G.wk})}
function loadG(m){if(m&&m.g){G.gr=m.g.gr||{};G.xp=m.g.xp||0;G.sk=m.g.sk||0;G.last=m.g.last||0;G.ty=m.g.ty||{};G.lg=m.g.lg||[0,0,0,0,0];G.wk=m.g.wk||{}}}
function bumpStreak(){var t=today();if(G.last===t)return;G.sk=(G.last===t-1)?G.sk+1:1;G.last=t}
/* ============ xotira (SRS) ============
   yozuv: [bosqich, muddat(kun), unutishlar, qulaylik, takror, oxirgi ko'rish, oxirgi xato, oraliq, unutish oralig'i]
   eski [bosqich, muddat] yozuvlar ham ishlaydi. Xato = bosqich 1ga tushadi, qulaylik pasayadi; qiyin gaplar tez-tez qaytadi.
   Hech qachon "tugatilmaydi": eng uzun oraliq MAXIV kun, keyin yana qaytadi. */
function nr(r){var t=today();r=r||[];var st=r[0]||1;return {st:st,due:r[1]==null?t+1:r[1],lap:r[2]||0,ez:r[3]||2.5,rep:r[4]||0,seen:r[5]||0,wr:r[6]||0,iv:r[7]||IV[Math.min(7,st)]||1,gap:r[8]||0}}
function pk(o){return [o.st,o.due,o.lap,Math.round(o.ez*100)/100,o.rep,o.seen,o.wr,o.iv,o.gap]}
function newRec(hard){var t=today();return pk({st:1,due:t+1,lap:0,ez:hard?2.1:2.5,rep:0,seen:t,wr:hard?t:0,iv:1,gap:0})}
function grade(o,ok,t){var n=Object.assign({},o);n.seen=t;
  if(ok){if(o.seen===t&&o.rep>0)return n;
    n.rep=o.rep+1;n.st=Math.min(7,o.st+1);n.ez=Math.min(2.8,o.ez+.08);
    var iv=Math.max(IV[n.st],Math.round(o.iv*o.ez)),cap=o.lap>=4?7:o.lap>=2?14:MAXIV;
    n.iv=Math.max(1,Math.min(iv,cap,MAXIV));n.due=t+n.iv}
  else{n.lap=o.lap+1;n.wr=t;n.gap=o.seen?Math.max(0,t-o.seen):Math.max(0,t-(o.due-o.iv));n.st=1;n.iv=1;n.ez=Math.max(1.3,o.ez-.2);n.due=t+1}
  return n}
function ret(o,t){var e=Math.max(0,t-(o.due-o.iv));return Math.pow(.9,e/Math.max(1,o.iv))}
function isWeak(o){return o.lap>=2||o.ez<1.7}
function allRecs(){var out=[];Object.keys(S).forEach(function(k){if(!/^s\d+$/.test(k)||S[k].ver!==COURSE)return;var d=+k.slice(1),day=DAYS[d-1];if(!day)return;var v=S[k].v||[];
  for(var i=0;i<day.i.length;i++)if(v[i])out.push({day:d,idx:i,it:day.i[i],r:nr(v[i])})});return out}
function prio(w){return (today()-w.r.due)+w.r.lap*2+(w.r.ez<1.8?2:0)}
function dueAll(){var t=today();return allRecs().filter(function(w){return w.r.due<=t}).map(function(w){w.over=t-w.r.due;return w}).sort(function(a,b){return prio(b)-prio(a)})}
function learnedAll(){return allRecs()}
function weakAll(){return allRecs().filter(function(w){return isWeak(w.r)}).sort(function(a,b){return b.r.lap-a.r.lap||a.r.ez-b.r.ez})}
function tyStat(ty,ok){var a=G.ty[ty]||(G.ty[ty]=[0,0]);a[ok?0:1]++;var k=String(today()),w=G.wk[k]||(G.wk[k]=[0,0]);w[ok?0:1]++;
  var ks=Object.keys(G.wk);if(ks.length>21)ks.sort(function(x,y){return x-y}).slice(0,ks.length-21).forEach(function(x){delete G.wk[x]})}
function lagStat(g){G.lg[g<=1?0:g<=3?1:g<=7?2:g<=30?3:4]++}
function pickType(o){var a=(o.lap>=2||o.st<=2)?["mc","listen","uzru","tf"]:o.st<=4?["fill","uzru","listen","dict"]:["dict","build","speak","fill","listen"];return a[Math.floor(Math.random()*a.length)]}

/* ============ bosh sahifa (yo'l xaritasi) ============ */
function home(){if(!DAYS[DAY-1])return memo();if(L&&L.dirty)saveG();L=null;
  var day=DAYS[DAY-1];its=day.i;
  var nodes=UN.map(function(u,i){var st=i<dayRec.p?"done":i===dayRec.p?"cur":"lock";return node(i,st,u.e,u.n)});
  var mst=dayRec.p>UN.length?"done":dayRec.p===UN.length?"cur":"lock";nodes.push(node(UN.length,mst,"🏆","Yakuniy test"));
  $("#app").innerHTML='<div class="hd"><span class="y">🔥 '+G.sk+'</span><span class="p">⭐ '+G.xp+' XP</span><span class="h">❤️ 5</span></div>'+
    '<div class="unit"><small>'+day.lv+' · KUN '+DAY+'</small><h2>'+day.e+' '+esc(day.t)+(day.k>1?' ('+day.p+'/'+day.k+')':'')+'</h2><div class="sit">📍 '+esc(day.s)+'</div></div>'+
    '<div class="path" style="padding-bottom:10px">'+nodes.join("")+'</div>'+(gramFor(DAY)?'<div class="bd" style="padding-top:0"><button class="op" style="border-color:#1cb0f6;background:#ddf4ff" onclick="gStart()">📘 <b>Grammatika — dam olish</b><br><small style="color:var(--mut)">'+esc(gramFor(DAY).t)+(G.gr[gramIdx(DAY)]?' · ✅ bajarilgan':' · 2 daqiqa, hech qanday stress yo\'q')+'</small></button></div>':'')+
    (dayRec.p>UN.length?'<div class="bd"><div class="note" style="text-align:center">🎉 Bugungi dars tayyor! Botga qaytib, shu kunning testini bosing.</div></div>':'')}
function node(i,st,e,name){var off=[0,50,-45,40,0,-30][i%6];
  return '<div style="transform:translateX('+off+'px);text-align:center"><button class="nd '+st+'" '+(st==="lock"?"":'onclick="start('+i+')"')+'>'+(st==="cur"?'<span class="s">BOSHLASH</span>':'')+(st==="done"?"⭐":e)+'</button><div class="lb">'+esc(name)+'</div></div>'}


/* ============ grammatika (har 5-kunda, 1 mavzu) ============ */
function gramIdx(d){return d%5===0?d/5-1:-1}
function gramFor(d){var i=gramIdx(d);return window.GRAM&&i>=0?GRAM[i]||null:null}
var GR=null;

  else if(!ok&&it.k>=0&&!it.re&&L.wrongK)L.wrongK[it.k]=1;
  if(ok){snd(660);snd(880,.2);hap(true);L.xp+=10}
  else{snd(200,.3);hap(false);L.err++;
    if(L.test){L.miss.push(it.k)}else{L.hp--;L.q.push(mkEx(it.t,s,it.k));L.tot++;if(L.rev||wasOld)L.q.splice(L.i+1,0,{t:"teach",item:s,k:-1,re:1})}}
  draw()}
function nxt(ok){try{if(REC&&REC.state==="recording")REC.stop()}catch(e){}if(ok)L.d++;L.i++;L.st="ask";L.sel=null;L.pick=[];if(L.hp<=0)return dead();draw()}
function dead(){saveG();$("#app").innerHTML='<div class="end"><div class="e">💔</div><h1 style="color:var(--r)">Jonlar tugadi</h1><p>Xafa bo‘lmang, qaytadan urinib ko‘ring!</p><div class="bd"><button class="btn" onclick="start('+L.u+')">Qayta urinish</button><br><br><button class="op" style="text-align:center" onclick="home()">Bosh sahifa</button></div></div>'}
function confetti(){var c="";for(var i=0;i<24;i++)c+='<span class="cf" style="left:'+Math.random()*95+'%;animation-delay:'+Math.random()*.8+'s">'+["🎉","⭐","✨","🟢"][i%4]+'</span>';return c}
function fin(){var g=20+L.xp,u=L.u,t=today();G.xp+=g;bumpStreak();saveG();
  if(u<UN.length){UN[u].k.forEach(function(k){if(!dayRec.v[k])dayRec.v[k]=newRec(!!(L.wrongK&&L.wrongK[k]))})}
  if(u===dayRec.p)dayRec.p=Math.min(dayRec.p+1,UN.length+1);
  saveDay();snd(523);setTimeout(function(){snd(784,.3)},150);
  var last=u>=UN.length;
  $("#app").innerHTML=confetti()+'<div class="end"><div class="e">🏆</div><h1>'+(last?"Kun darsi tugadi!":"Dars tugadi!")+'</h1><div class="stat"><div style="color:#ce82ff">⭐ +'+g+' XP</div><div style="color:#ff9600">🔥 '+G.sk+'</div><div style="color:var(--g)">🎯 '+(L.err?Math.max(0,100-L.err*12):100)+'%</div></div>'+
    (L.res&&L.res.length?'<div class="note">🔁 '+L.res.length+' ta eski gap takrorlandi'+(L.res.filter(function(r){return !r.ok}).length?', '+L.res.filter(function(r){return !r.ok}).length+' tasi unutilgan — ertaga yana chiqadi.':' — hammasi esingizda! 👏')+'</div>':'')+
    (last?'<div class="note">Endi botga qaytib, shu kunning testini bosing.</div>':'')+'<div class="bd"><button class="btn" onclick="home()">Davom etish</button></div></div>'}

/* ============ takrorlash sessiyasi ============ */
function reviewNow(){var l=dueAll();if(!l.length)return memo();startReview(l)}
function weakNow(){startReview(weakAll())}
function startReview(list){list=list.slice(0,REVN);if(!list.length)return memo();its=list.map(function(w){return w.it});
  var q=fixAdj(sh(list.map(function(w,k){var e=mkEx(pickType(w.r),w.it,k);e.old=w;return e})));
  if(list.length>=4)q.splice(Math.ceil(q.length/2),0,mkMatch(sh(list.map(function(_,i){return i})).slice(0,Math.min(5,list.length))));
  L={u:-2,rev:true,q:q,i:0,d:0,tot:q.length,hp:99,st:"ask",sel:null,pick:[],xp:0,err:0,res:[]};draw()}
function whenTxt(d){return d<=0?"bugun":d===1?"ertaga":d+" kundan keyin"}
function finRev(){var res=L.res,okN=res.filter(function(r){return r.ok}).length,bad=res.filter(function(r){return !r.ok}),g=10+L.xp,t=today();
  G.xp+=g;bumpStreak();saveG();snd(523);setTimeout(function(){snd(784,.3)},150);
  var more=dueAll().length,pct=res.length?Math.round(okN/res.length*100):100;
  var ms=bad.map(function(r){return '<div><div class="ru" style="font-size:18px">'+esc(r.it[1])+'</div><div class="tr" style="margin:2px 0 0">'+esc(r.it[2])+'</div><div class="note" style="margin:4px 0 0">'+(r.gap>0?r.gap+' kundan keyin unutdingiz. ':'')+'Ertaga yana ko‘rasiz.'+(r.lap>=2?' <b>'+r.lap+'-marta</b> — bu gap qiyin, tez-tez qaytadi.':'')+'</div></div>'}).join("");
  var good=res.filter(function(r){return r.ok}).length;
  $("#app").innerHTML=confetti()+'<div class="bd end" style="padding-top:20px"><div class="e">'+(bad.length?"💪":"🏆")+'</div><h1>'+(bad.length?"Takrorlash tugadi":"Hammasi esingizda!")+'</h1><div class="stat"><div style="color:var(--g)">✅ '+okN+'</div><div style="color:var(--r)">❌ '+bad.length+'</div><div style="color:#ce82ff">⭐ +'+g+'</div></div>'+
    (good?'<div class="note">'+good+' ta gap keyingi takrorlashga uzoqroq muddatga o‘tdi.</div>':'')+
    (bad.length?'<div class="note" style="text-align:left">Unutilgan gaplar (bular tez qaytadi):</div><div class="miss">'+ms+'</div>':'')+
    (more?'<button class="btn" onclick="reviewNow()">Yana takrorlash ('+more+' ta qoldi)</button><br><br>':'')+
    '<button class="op" style="text-align:center" onclick="memo()">📊 Xotira holati</button>'+(DAYS[DAY-1]?'<br><button class="op" style="text-align:center" onclick="home()">Bosh sahifa</button>':'')+'</div>'}

/* ============ xotira holati: nimani unutyapsiz, qayerda qiynalasiz ============ */
var TYN={mc:"Tarjimani tanlash",tf:"Ha / Yo‘q",fill:"Bo‘sh joyni to‘ldirish",build:"Gap tuzish",uzru:"O‘zbekcha → ruscha",listen:"Eshitib tushunish"};
var LGN=["1 kun ichida","2–3 kun ichida","4–7 kun ichida","8–30 kun ichida","30 kundan keyin"];
function barRow(l,r,p,c){return '<div style="margin:9px 0"><div class="mr" style="border:0;padding:0"><span>'+l+'</span><span>'+r+'</span></div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,Math.round(p)))+'%;background:'+c+'"></i></div></div>'}
function memo(){if(L&&L.dirty)saveG();L=null;var t=today(),A=allRecs(),n=A.length,hasDay=!!DAYS[DAY-1],x=hasDay?'<button class="x" onclick="home()">✕</button>':'';
  var top='<div class="top">'+x+'<div style="flex:1;font-weight:900;font-size:20px">📊 Xotira holati</div></div>';
  if(!n){$("#app").innerHTML=top+'<div class="bd"><div class="end"><div class="e">🦊</div><p class="note">Hali o‘rganilgan gap yo‘q. Birinchi darsni tugating — keyin bu yerda xotirangiz ko‘rinadi.</p></div></div>';return}
  var due=A.filter(function(w){return w.r.due<=t}),weak=weakAll(),weakNd=weak.filter(function(w){return w.r.due>t}),strong=A.filter(function(w){return w.r.st>=5&&w.r.due>t&&!isWeak(w.r)});
  var avg=Math.round(A.reduce(function(s,w){return s+ret(w.r,t)},0)/n*100);
  var h='<div class="bd"><div class="stat" style="margin-top:6px"><div style="color:var(--tx)">📚 '+n+'</div><div style="color:var(--g)">🟢 '+strong.length+'</div><div style="color:#ff9600">🟠 '+due.length+'</div><div style="color:var(--r)">🔴 '+weak.length+'</div></div>'+
    '<div class="sub" style="text-align:center">📚 o‘rganilgan · 🟢 mustahkam · 🟠 takrorlash vaqti · 🔴 qiyin gaplar</div>'+
    barRow('Hozir taxminan eslab turibsiz','~'+avg+'%',avg,avg>=80?'var(--g)':avg>=60?'#ff9600':'var(--r)')+
    (due.length?'<button class="btn" style="margin-top:10px" onclick="reviewNow()">🔁 Takrorlash ('+due.length+')</button>':'<div class="note" style="text-align:center">✅ Hozir takrorlash kerak emas. Hammasi esingizda.</div>');
  if(weak.length)h+='<button class="rv" onclick="weakNow()"><b>🎯 Qiyin gaplarni mashq qilish ('+weak.length+')</b><br><small>Eng ko‘p unutganlaringizdan boshlanadi</small></button>';
  var fc=[],mx=1;for(var i=0;i<7;i++){var c=A.filter(function(w){return i===0?w.r.due<=t:w.r.due===t+i}).length;fc.push(c);if(c>mx)mx=c}
  h+='<div class="sec">📅 Keyingi 7 kun</div><div class="sub">Qaysi kuni nechta gapni takrorlash kerak — shunda esdan chiqmaydi.</div>'+fc.map(function(c,i){return barRow(i===0?'Bugun':i===1?'Ertaga':i+' kundan keyin',c+' ta',c/mx*100,'var(--b)')}).join("");
  var ts=Object.keys(TYN).filter(function(k){var a=G.ty[k];return a&&a[0]+a[1]>=3}).map(function(k){var a=G.ty[k],p=a[0]/(a[0]+a[1])*100;return {k:k,p:p,n:a[0]+a[1]}}).sort(function(a,b){return a.p-b.p});
  if(ts.length){h+='<div class="sec">🧩 Qaysi mashqda qiynalasiz</div><div class="sub">'+(ts[0].p<80?'Eng qiyini: <b>'+TYN[ts[0].k]+'</b> ('+Math.round(ts[0].p)+'% to‘g‘ri). Shunga ko‘proq e’tibor bering.':'Hamma mashq turida yaxshi natija!')+'</div>'+ts.map(function(o){return barRow(TYN[o.k],Math.round(o.p)+'% · '+o.n+' ta',o.p,o.p>=85?'var(--g)':o.p>=65?'#ff9600':'var(--r)')}).join("")}
  var lg=G.lg,ls=lg.reduce(function(a,b){return a+b},0);
  if(ls>0){var mi=lg.indexOf(Math.max.apply(null,lg));h+='<div class="sec">⏳ Qachon unutasiz</div><div class="sub">Gapni oxirgi ko‘rganingizdan keyin qancha vaqtda unutganingiz ('+ls+' ta holat). Ko‘pincha: <b>'+LGN[mi]+'</b>.</div>'+lg.map(function(c,i){return barRow(LGN[i],c+' ta',c/Math.max(1,Math.max.apply(null,lg))*100,i===mi?'var(--r)':'var(--bd2)')}).join("")}
  var wk=Object.keys(G.wk).filter(function(k){return t-k<7}),wa=0,wo=0;wk.forEach(function(k){wo+=G.wk[k][0];wa+=G.wk[k][0]+G.wk[k][1]});
  if(wa)h+='<div class="sec">📆 So‘nggi 7 kun</div><div class="stat" style="justify-content:flex-start"><div>🗓 '+wk.length+' kun</div><div>✍️ '+wa+' javob</div><div style="color:var(--g)">🎯 '+Math.round(wo/wa*100)+'%</div></div>';
  h+='<div class="sec">🔴 Qiynalayotgan gaplar</div>';
  if(!weak.length)h+='<div class="note">Hozircha qiynalayotgan gap yo‘q 👍</div>';
  else{h+='<div class="sub">Bular tez-tez unutiladi — dastur ularni boshqalarga qaraganda ko‘proq qaytaradi.</div><div class="miss">'+weak.slice(0,15).map(function(w){var o=w.r;
    return '<div><div class="ru" style="font-size:18px">'+esc(w.it[1])+'</div><div class="tr" style="margin:2px 0 0">'+esc(w.it[2])+'</div><div class="note" style="margin:4px 0 0">'+(o.lap?'<span class="chip" style="background:#ffe5e5;color:var(--r)">'+o.lap+' marta unutdingiz</span>':'')+(o.gap?'oxirgi marta '+o.gap+' kundan keyin unutdingiz · ':'')+'keyingi takror: '+whenTxt(o.due-t)+'</div></div>'}).join("")+'</div>'+(weak.length>15?'<div class="note">…va yana '+(weak.length-15)+' ta</div>':'')}
  $("#app").innerHTML=top+h+'<div style="height:40px"></div></div>'}

/* ============ so'zma-so'z tarjima: suz.json {gap_raqami:[har so'z tarjimasi]} ============ */
var SUZ=null;
function fillWords(){var el=document.querySelector(".wl[data-n]");if(!el)return;var n=+el.getAttribute("data-n");
  if(!SUZ)SUZ=fetch("suz.json").then(function(r){if(!r.ok)return fetch("suz_tayyor.json");return r}).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return {}});
  SUZ.then(function(j){if(!el.isConnected)return;var g=j[n],it=its.filter(function(x){return x[0]===n})[0];if(!g||!it)return;var w=words(it[1]);
    el.innerHTML=w.map(function(x,i){return g[i]?'<div class="w"><b>'+esc(x)+'</b><span>'+esc(g[i])+'</span></div>':""}).join("")})}
/* ============ rasmlar: sc/<blok>.json (100 tadan), yo'q bo'lsa img/<n>.svg, yo'q bo'lsa emoji ============ */
var SCB={};
function scBlock(b){if(!SCB[b])SCB[b]=fetch("sc/"+b+".json").then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return {}});return SCB[b]}
function fillScene(){var el=document.querySelector(".scene[data-n]");if(!el)return;var n=+el.getAttribute("data-n");
  scBlock(Math.floor((n-13)/100)).then(function(j){if(!el.isConnected)return;var v=j[n];
    if(v&&/^<svg[\s>]/.test(v)&&!/<script|\son\w+=|href=/i.test(v)){el.innerHTML=v;el.classList.add("has")}
    else{var im=new Image();im.alt="";im.onload=function(){if(el.isConnected){el.innerHTML="";el.appendChild(im);el.classList.add("has")}};im.src="img/"+n+".svg"}})}
/* ============ test (kun oxirida; natija botga ketadi) ============ */
function startTest(){var T5=["mc","tf","fill","build","uzru","dict"],off=Math.floor(Math.random()*6),q=fixAdj(sh(its.map(function(_,k){return mkEx(T5[(k+off)%6],its[k],k)})));
  L={u:-1,test:true,q:q,i:0,d:0,tot:q.length,hp:99,st:"ask",sel:null,pick:[],xp:0,err:0,miss:[]};draw()}
function finTest(){var N=its.length,miss=L.miss.filter(function(k,i,a){return a.indexOf(k)===i}),score=N-miss.length,r=score/N,pass=r>=PASS,st=r>=.9?3:pass?2:r>=.5?1:0,t=today();
  its.forEach(function(_,k){var cur=dayRec.v[k];if(miss.indexOf(k)>=0)dayRec.v[k]=pk(grade(nr(cur||newRec()),false,t));else if(!cur)dayRec.v[k]=newRec()});saveDay();saveG();
  var C=2*Math.PI*60,svg='<svg width="150" height="150"><circle cx="75" cy="75" r="60" fill="none" stroke="var(--bd)" stroke-width="14"/><circle cx="75" cy="75" r="60" fill="none" stroke="'+(pass?"#58cc02":"#ff4b4b")+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-r))+'"/></svg>';
  var ms=miss.map(function(k){return '<div><div class="ru" style="font-size:18px">'+esc(its[k][1])+'</div><div class="tr" style="margin:2px 0 0">'+esc(its[k][2])+'</div></div>'}).join("");
  var can=inTG&&Number.isInteger(LID),payload=JSON.stringify({l:LID,s:score,n:N});window.__payload=payload;
  snd(pass?523:200);
  $("#app").innerHTML=(pass?confetti():"")+'<div class="bd end" style="padding-top:20px"><div class="ring">'+svg+'<b>'+Math.round(r*100)+'%</b></div><div class="stars">'+"★".repeat(st)+"☆".repeat(3-st)+'</div><h1 style="color:var(--tx);font-size:26px">'+(pass?"Test topshirildi! 🎉":"Yana bir urinib ko‘ring")+'</h1>'+
    '<div class="stat"><div style="color:var(--g)">✅ '+score+'</div><div style="color:var(--r)">❌ '+(N-score)+'</div></div>'+(miss.length?'<div class="note" style="text-align:left">Xato qilingan gaplar:</div><div class="miss">'+ms+'</div>':'')+
    (can?'<button class="btn" id="sendb">Natijani botga yuborish</button>':'<div class="note">Bu test Telegram bot tugmasi orqali ochilishi kerak, aks holda natija botga yetmaydi.</div>')+'</div>';
  var sb=document.getElementById("sendb");if(sb)sb.onclick=function(){sb.disabled=true;try{tg.sendData(payload)}catch(e){sb.disabled=false}}}

/* ============ boshlash ============ */
function init(){
  if(!DAYS.length||(!REVMODE&&!DAYS[DAY-1])){$("#app").innerHTML='<div class="end"><div class="e">🦊</div><h1>Dars topilmadi</h1><p class="note">Botdagi tugma orqali oching.</p></div>';return}
  $("#app").innerHTML='<div class="end"><div class="e">🦊</div><p class="note">Yuklanmoqda…</p></div>';
  Store.all().then(function(m){S=m;loadG(m);
    var day=DAYS[DAY-1];
    if(day){its=day.i;var n=its.length,k=Math.ceil(n/4),b=Math.floor(n/k),e=n%k,p=0,E=["🌱","🌿","🌳","🍀"];
      for(var i=0;i<k;i++){var sz=b+(i<e?1:0),ks=[];for(var j=0;j<sz;j++)ks.push(p+j);p+=sz;UN.push({k:ks,e:E[i%4],n:"Dars "+(i+1)})}
      var r=S["s"+DAY];if(r&&r.ver!==COURSE)r=null;dayRec={v:(r&&r.v)||[],p:(r&&r.p)||0}}
    if(TESTMODE&&day)return startTest();
    if(REVMODE){var dl=dueAll();return dl.length?startReview(dl):memo()}
    OLD=dueAll().filter(function(w){return w.day!==DAY}).slice(0,Math.min(28,UN.length*7));OLDPER=Math.min(7,Math.ceil(OLD.length/UN.length))||1;
    home()})}
init();
</script></body></html>
